<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>国旗护卫队纳新群 · 入群二维码</title>
<meta name="description" content="扫描二维码加入2026国旗护卫队纳新微信群">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:#f2f6f4; color:#1a1a1a; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 40px;
  }
  .brand { display:flex; align-items:center; gap:8px; color:#07c160; font-weight:600; font-size:15px; margin-bottom:18px; }
  .brand .dot { width:8px; height:8px; border-radius:50%; background:#07c160; box-shadow:0 0 0 4px rgba(7,193,96,.15); }
  .card {
    background:#fff; border-radius:16px; width:100%; max-width:420px;
    padding:28px 22px 24px; box-shadow:0 8px 28px rgba(0,0,0,.07); text-align:center;
  }
  .group-title { font-size:21px; font-weight:700; margin-bottom:4px; }
  .group-sub { font-size:13px; color:#999; margin-bottom:18px; }
  .notice {
    background:#fff8e6; color:#b26a00; font-size:13px; border-radius:10px;
    padding:10px 12px; margin-bottom:16px; line-height:1.55; text-align:left; display:none;
  }
  .browser-tip {
    display:none; background:#eef7ff; color:#0a5fcc; border-radius:10px;
    padding:10px 12px; font-size:13px; line-height:1.65; margin-bottom:16px; text-align:left;
  }
  .browser-tip b { color:#0a5fcc; }
  .qr-wrap { border-radius:12px; overflow:hidden; border:1px solid #eee; background:#fff; }
  .qr-wrap img { display:block; width:100%; height:auto; }
  .btn {
    display:block; margin-top:18px; background:#07c160; color:#fff; text-decoration:none;
    font-size:17px; font-weight:600; padding:14px 0; border-radius:999px;
    transition:background .15s;
  }
  .btn:active { background:#06ad56; }
  .tip { margin-top:16px; font-size:13px; color:#888; line-height:1.7; }
  .tip b { color:#07c160; }
  .footer { margin-top:22px; font-size:12px; color:#aaa; text-align:center; line-height:1.9; }
</style>
</head>
<body>

  <div class="brand"><span class="dot"></span>国旗护卫队 · 2026 纳新</div>

  <div class="card">
    <div class="group-title" id="groupName">加载中…</div>
    <div class="group-sub">微信扫码 · 加入纳新群</div>

    <div class="notice" id="notice"></div>
    <div class="browser-tip" id="browserTip">
      您正在浏览器中打开：请<b>长按下方二维码保存图片</b>，再打开微信 →「扫一扫」→ 右上角「相册」→ 选择刚保存的图片，即可入群。
    </div>

    <div class="qr-wrap">
      <img id="qrImg" alt="微信群二维码" src="qrcode-current.png">
    </div>

    <a class="btn" id="joinBtn" href="#">点击加入群聊</a>

    <div class="tip" id="tip"></div>
  </div>

  <div class="footer" id="footer"></div>

<script src="config.js"></script>
<script>
(function () {
  var cfg = window.HUOMA_CONFIG || {};
  var isWeChat = /MicroMessenger/i.test(navigator.userAgent);
  var cacheV = '?v=' + String(cfg.updatedAt || '').replace(/-/g, '');

  document.title = (cfg.groupName || '纳新群') + ' · 入群二维码';
  document.getElementById('groupName').textContent = cfg.groupName || '微信群';

  var img = document.getElementById('qrImg');
  img.src = (cfg.qrImage || 'qrcode-current.png') + cacheV;

  var btn = document.getElementById('joinBtn');
  if (cfg.inviteUrl) {
    btn.href = cfg.inviteUrl;
  } else {
    btn.style.display = 'none';
  }

  document.getElementById('tip').innerHTML = isWeChat
    ? '在微信中打开：<b>长按二维码 → 识别图中二维码</b>，或点击上方按钮直接入群。'
    : '也可以<b>截图本页</b>，打开微信「扫一扫 → 相册」识别截图入群。';

  if (!isWeChat) document.getElementById('browserTip').style.display = 'block';

  if (cfg.notice) {
    var n = document.getElementById('notice');
    n.textContent = '📢 ' + cfg.notice;
    n.style.display = 'block';
  }

  var footer = '页面群码更新于 ' + (cfg.updatedAt || '—')
    + (cfg.expireBefore ? '（到期后将自动更新，本入口长期有效）' : '');
  if (cfg.contact) footer += '<br>入群遇到问题？联系：' + cfg.contact;
  document.getElementById('footer').innerHTML = footer;
})();
</script>
</body>
</html>
